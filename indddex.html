<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mecha YT — Local Player</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:#000;color:#eee;font-family:system-ui,-apple-system,sans-serif;overflow-x:clip;width:100%}.playerStickyWrapper{position:sticky;top:0;z-index:100;width:100%;background:#000}.playerHeader{height:50px;background:#151515;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #252525}.playerHeaderLogo{display:flex;align-items:center;height:46px;max-width:120px;overflow:hidden}.playerHeaderLogo img{max-width:100%;max-height:100%;object-fit:contain}.headerSearch{display:flex;align-items:center;background:#2a2a2a;border-radius:5px;padding:4px 10px}.headerSearch input{background:transparent;border:none;color:#eee;outline:none;width:120px;font-size:16px}.headerSearch input::placeholder{color:#888}.headerSearch button{background:transparent;border:none;color:#aaa;cursor:pointer;padding:0 0 0 5px}.playerContainer{position:relative;width:100%;height:0;padding-bottom:56.25%;background:#000;overflow:hidden;touch-action:manipulation}.playerVideo{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}.posterOverlay,.playerOverlay,.audioCoverOverlay{position:absolute;inset:0;width:100%;height:100%}.posterOverlay{z-index:30;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}.posterOverlay.hidden{display:none}.posterImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.posterDark{position:absolute;inset:0;background:rgba(0,0,0,.25)}.posterPlay{position:relative;z-index:2;width:58px;height:58px;border:0;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 15px rgba(0,0,0,.6)}#tapLayer{position:absolute;inset:0;z-index:11;background:transparent;cursor:pointer;touch-action:manipulation}
.playerOverlay{pointer-events:none;transition:opacity .25s ease;background:rgba(0,0,0,.35);z-index:10;opacity:0}.playerOverlay.show{opacity:1;pointer-events:auto}.bigPlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border:0;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer}.controls{position:absolute;left:0;right:0;bottom:0;padding:25px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.92));pointer-events:auto}.seek{display:block;width:100%;height:4px;margin:0 0 8px;padding:0;accent-color:#fff;cursor:pointer}.controlRow{display:flex;align-items:center;gap:4px}.controlRow button{background:transparent;color:#fff;border:0;padding:6px 7px;font-size:15px;cursor:pointer}.time{font-size:11px;color:#ddd;min-width:70px;text-align:center}.spacer{flex:1}.speed{font-size:12px!important}.volume{width:55px;height:4px;accent-color:#fff}.audioCoverOverlay{display:none;background:#000;z-index:20;align-items:center;justify-content:center}.audioCoverOverlay.active{display:flex}.audioCoverImg{width:100%;height:100%;object-fit:cover;opacity:.65}.restoreVideoBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;border:1.5px solid #fff;border-radius:30px;padding:9px 18px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer}.actionGrid{display:flex;align-items:center;justify-content:space-around;background:#141414;padding:8px 5px;border-bottom:1px solid #252525}.actionBtn{background:#222;color:#ccc;border:0;border-radius:6px;padding:7px 10px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer}.actionBtn:active{background:#333}.autoplay-on{color:#7abdff!important;border:1px solid #7abdff}.videoTitleBox{padding:10px 12px;background:#121212;border-bottom:1px solid #222}.videoTitle{font-size:13px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.status{font-size:10px;color:#888;margin-top:4px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px}.gridCard{background:#111;border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.gridThumbBox{position:relative;width:100%;aspect-ratio:16/9;background:#222}.gridThumb{width:100%;height:100%;object-fit:cover}.gridMeta{padding:5px}.gridTitle{font-size:10px;font-weight:700;line-height:1.2;color:#eee;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.gridChannel{font-size:9px;color:#888;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.moreRelated{width:calc(100% - 12px);margin:10px 6px 20px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:12px;font-weight:700;display:none;cursor:pointer}.loading{text-align:center;color:#777;font-size:11px;padding:18px}.error{text-align:center;color:#f88;font-size:11px;padding:18px}
</style>
</head>
<body>
<div class="playerStickyWrapper">
<div class="playerHeader"><div class="playerHeaderLogo" id="logoRefreshBtn" style="cursor:pointer"><img src="https://i.ibb.co.com/n8nbmMwd/logo.png" alt="Mecha YT"></div><div class="headerSearch"><input type="text" id="searchInput" value="乃木坂46" placeholder="Cari video..."><button type="button" id="searchBtn">🌀</button></div></div>
<div class="playerContainer" id="playerContainer">
<video id="ytplayer" class="playerVideo" playsinline preload="none"></video>
<div id="tapLayer" aria-hidden="true"></div>
<div id="playerOverlay" class="playerOverlay"><button id="bigPlay" class="bigPlay" type="button">▶</button><div class="controls"><input id="seek" class="seek" type="range" min="0" max="100" value="0"><div class="controlRow"><button id="playBtn" type="button">▶</button><button id="back10Btn" type="button">↶</button><button id="forward10Btn" type="button">↷</button><button id="muteBtn" type="button">🔊</button><input id="volume" class="volume" type="range" min="0" max="100" value="100"><span id="time" class="time">0:00 / 0:00</span><span class="spacer"></span><button id="speedBtn" class="speed" type="button">1×</button><button id="fsBtn" type="button">⛶</button></div></div></div>
<div id="posterOverlay" class="posterOverlay"><img id="posterImage" class="posterImage" src="" alt="Video"><div class="posterDark"></div><button id="posterPlay" class="posterPlay" type="button">▶</button></div>
<div id="audioCoverOverlay" class="audioCoverOverlay"><img id="audioCoverImg" class="audioCoverImg" src="" alt="Thumbnail Video"><button id="restoreVideoBtn" class="restoreVideoBtn" type="button"><span>▶</span> Fitur Video</button></div>
</div>
<div class="actionGrid"><button class="actionBtn" id="qualityBtn" type="button">👁️ <span id="qualityLabel">Auto</span></button><button class="actionBtn autoplay-on" id="autoPlayToggleBtn" type="button">🔁 Auto Next: ON</button><button class="actionBtn" id="shareBtn" type="button">🔗 Share</button><button class="actionBtn" id="audioOnlyBtn" type="button" style="color:#7abdff">🎧 Background</button></div>
<div class="videoTitleBox"><div id="videoTitle" class="videoTitle">Pilih video dari hasil pencarian</div><div id="status" class="status">Mesin lokal • native video • proxy no-cache • tanpa YouTube iframe</div></div>
</div>
<div id="gridResults" class="grid3"></div><button id="moreRelatedBtn" class="moreRelated" type="button">Muat lebih banyak</button>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), video=$('ytplayer');
let results=[], currentIndex=-1, desiredQuality=360, qualities=[360,144,240,360,480], speedIndex=0, speeds=[1,1.25,1.5,1.75,2], autoNext=true, searching=false, loadingPlay=false;
const api = (p) => fetch(p, { cache: 'no-store' }).then(async (r) => {
  const text = await r.text();
  let j;
  try {
    j = JSON.parse(text);
  } catch (e) {
    throw Error("Server Cloudflare Crash/HTML");
  }
  if (!r.ok || j.ok === false) throw Error(j.error || ('HTTP ' + r.status));
  return j;
});
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(t){t=Number(t)||0;let m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}
function setStatus(s,err=false){$('status').textContent=s;$('status').style.color=err?'#f88':'#888';}
function render(items){results=items||[];$('gridResults').innerHTML=results.map((v,i)=>`<div class="gridCard" data-i="${i}"><div class="gridThumbBox"><img class="gridThumb" loading="lazy" src="${esc(v.thumbnail)}" alt=""></div><div class="gridMeta"><div class="gridTitle">${esc(v.title)}</div><div class="gridChannel">${esc(v.channel)}${v.duration?' • '+esc(v.duration):''}</div></div></div>`).join('');$('gridResults').querySelectorAll('.gridCard').forEach(c=>c.onclick=()=>selectVideo(Number(c.dataset.i)));}
async function doSearch(){const q=$('searchInput').value.trim();if(!q||searching)return;searching=true;setStatus('Mencari “'+q+'”…');$('gridResults').innerHTML='<div class="loading">Mencari video…</div>';try{const d=await api('/search?q='+encodeURIComponent(q));render(d.items);setStatus((d.items||[]).length+' hasil • klik thumbnail untuk memutar');}catch(e){$('gridResults').innerHTML='<div class="error">'+esc(e.message)+'</div>';setStatus('Search gagal',true);}finally{searching=false;}}
function setPoster(v){$('posterImage').src=v.thumbnail||`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;$('audioCoverImg').src=$('posterImage').src;$('posterOverlay').classList.remove('hidden');}
function selectVideo(i){const v=results[i];if(!v)return;currentIndex=i;$('videoTitle').textContent=v.title||'Video';setPoster(v);video.pause();video.removeAttribute('src');video.load();setStatus('Siap diputar • '+(desiredQuality===360?'360p prioritas':desiredQuality+'p target'));window.scrollTo({top:0,behavior:'smooth'});}
async function playCurrent(){const v=results[currentIndex];if(!v)return;if(loadingPlay)return;loadingPlay=true;setStatus('Mengambil stream '+(desiredQuality===360?'Auto/360p':desiredQuality+'p')+'…');try{const old=video.currentTime||0;video.pause();video.removeAttribute('src');video.load();video.src='/stream?id='+encodeURIComponent(v.id)+'&q='+desiredQuality+'&_='+Date.now();video.load();await new Promise((resolve,reject)=>{let done=false;const ok=()=>{if(done)return;done=true;cleanup();resolve()};const bad=()=>{if(done)return;done=true;cleanup();reject(Error('Stream tidak bisa dimuat'))};const cleanup=()=>{video.removeEventListener('loadedmetadata',ok);video.removeEventListener('error',bad)};video.addEventListener('loadedmetadata',ok);video.addEventListener('error',bad);setTimeout(()=>{if(!done)bad()},25000);});try{video.currentTime=old||0}catch(_e){}await video.play();$('posterOverlay').classList.add('hidden');setStatus('Memutar • '+(desiredQuality===360?'360p prioritas':desiredQuality+'p'));showOverlay();}catch(e){setStatus('Gagal jalur • server mencoba jalur lain: '+e.message,true);}finally{loadingPlay=false;}}
function showOverlay(){ $('playerOverlay').classList.add('show');clearTimeout(showOverlay.t);showOverlay.t=setTimeout(()=>{if(!video.paused)$('playerOverlay').classList.remove('show')},5000);}
function keepOverlay(){ $('playerOverlay').classList.add('show');clearTimeout(showOverlay.t);if(!video.paused)showOverlay.t=setTimeout(()=>$('playerOverlay').classList.remove('show'),5000);}
$('tapLayer').addEventListener('pointerup',()=>{if(video.paused)keepOverlay();else $('playerOverlay').classList.toggle('show')});
$('tapLayer').addEventListener('touchend',()=>{if(video.paused)keepOverlay();});
$('playerOverlay').addEventListener('pointerdown',keepOverlay,true);
function togglePlay(){if(video.paused)playCurrent();else video.pause();showOverlay();}
$('searchBtn').onclick=doSearch;$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});$('logoRefreshBtn').onclick=doSearch;
$('posterPlay').onclick=playCurrent;$('posterOverlay').onclick=e=>{if(e.target===$('posterOverlay')||e.target===$('posterImage'))playCurrent()};$('bigPlay').onclick=togglePlay;$('playBtn').onclick=togglePlay;
$('back10Btn').onclick=()=>video.currentTime=Math.max(0,video.currentTime-10);$('forward10Btn').onclick=()=>video.currentTime=Math.min(video.duration||1,video.currentTime+10);
$('muteBtn').onclick=()=>{video.muted=!video.muted;$('muteBtn').textContent=video.muted?'🔇':'🔊'};$('volume').oninput=e=>{video.volume=Number(e.target.value)/100;video.muted=video.volume===0};
$('seek').oninput=e=>{if(video.duration)video.currentTime=video.duration*(Number(e.target.value)/100)};$('speedBtn').onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;video.playbackRate=speeds[speedIndex];$('speedBtn').textContent=speeds[speedIndex]+'×'};
$('fsBtn').onclick=()=>{const el=$('playerContainer');if(document.fullscreenElement)document.exitFullscreen?.();else el.requestFullscreen?.()};
$('qualityBtn').onclick=()=>{desiredQuality=qualities[(qualities.indexOf(desiredQuality)+1)%qualities.length];$('qualityLabel').textContent=desiredQuality===360?'Auto':desiredQuality+'p';if(!video.paused&&currentIndex>=0)playCurrent()};
$('autoPlayToggleBtn').onclick=()=>{autoNext=!autoNext;$('autoPlayToggleBtn').textContent='🔁 Auto Next: '+(autoNext?'ON':'OFF');$('autoPlayToggleBtn').classList.toggle('autoplay-on',autoNext)};
$('shareBtn').onclick=async()=>{const v=results[currentIndex];if(!v)return;const url=location.origin+'/';try{await navigator.clipboard.writeText(url+'?v='+v.id);setStatus('Link disalin');}catch(_e){setStatus('Video ID: '+v.id)}};
$('audioOnlyBtn').onclick=()=>{$('audioCoverOverlay').classList.toggle('active');if($('audioCoverOverlay').classList.contains('active'))setStatus('Mode Background • audio tetap dari native player');else setStatus('Mode Video')};$('restoreVideoBtn').onclick=()=>$('audioCoverOverlay').classList.remove('active');
video.addEventListener('play',()=>{$('playBtn').textContent='⏸';$('bigPlay').style.display='none';showOverlay()});video.addEventListener('pause',()=>{$('playBtn').textContent='▶';$('bigPlay').style.display='flex';$('playerOverlay').classList.add('show');clearTimeout(showOverlay.t)});video.addEventListener('timeupdate',()=>{$('time').textContent=fmt(video.currentTime)+' / '+fmt(video.duration);$('seek').value=video.duration?video.currentTime/video.duration*100:0});video.addEventListener('ended',()=>{if(autoNext&&currentIndex+1<results.length)selectVideo(currentIndex+1),setTimeout(playCurrent,150)});
let lastTap=0;video.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<280){const x=e.changedTouches[0].clientX,mid=innerWidth/2;video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+(x<mid?-10:10)));showOverlay()}lastTap=now});
$('moreRelatedBtn').onclick=doSearch;
// Auto-load the same search shown in the original Mecha header.
doSearch();
})();
</script>
</body></html>
